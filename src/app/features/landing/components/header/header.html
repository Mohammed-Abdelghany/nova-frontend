<header class="sticky top-0 z-40 border-b border-nude-200/70 bg-white/75 backdrop-blur-md dark:border-nude-700/70 dark:bg-nude-900/80">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
    <a href="#top" class="group flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="h-9 w-9 shrink-0 text-sage-600 transition-transform duration-300 group-hover:scale-105 dark:text-sage-300" fill="none">
        <path d="M8 26c0 0-4-5-4-11 0-6 5-10 11-10 0 0 1 8-3 14-2.5 3.6-4 7-4 7Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M8 25c0-3 1.5-7 4-10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        <path d="M24 5 25 8.5 28.5 9.5 25 10.5 24 14 23 10.5 19.5 9.5 23 8.5Z" fill="currentColor" />
      </svg>
      <span class="text-xl font-semibold uppercase tracking-[0.25em] text-nude-700 dark:text-nude-50">Nova</span>
    </a>

    <nav class="hidden items-center gap-8 text-sm font-semibold text-nude-700/75 dark:text-nude-300 sm:flex">
      @for (link of [{ label: 'منتجاتنا', href: '#products' }, { label: 'لماذا Nova', href: '#trust' }, { label: 'تواصلي معنا', href: '#contact' }]; track link.label) {
        <a [href]="link.href" class="group relative py-1 transition hover:text-sage-600 dark:hover:text-sage-300">
          {{ link.label }}
          <span class="absolute inset-x-0 -bottom-0.5 h-0.5 origin-center scale-x-0 rounded-full bg-gradient-to-l from-sage-500 to-blush-400 transition-transform duration-300 group-hover:scale-x-100"></span>
        </a>
      }
    </nav>

    <div class="flex items-center gap-1">
      <app-theme-toggle />

      <button
        type="button"
        (click)="openCart()"
        class="group relative rounded-full p-2.5 text-nude-400 transition-all duration-300 hover:bg-nude-100 hover:text-blush-500 dark:text-nude-300 dark:hover:bg-nude-700 dark:hover:text-blush-300"
        aria-label="سلة المشتريات"
        title="سلة المشتريات"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l2.2 11.4a2 2 0 002 1.6h7.6a2 2 0 002-1.6L20 8H6" />
          <circle cx="9.5" cy="20" r="1.4" /><circle cx="17" cy="20" r="1.4" />
        </svg>
        @if (cartService.itemCount() > 0) {
          <span class="absolute -top-0.5 -end-0.5 flex h-4.5 w-4.5 items-center justify-center rounded-full bg-blush-500 text-[10px] font-bold text-white">
            {{ cartService.itemCount() }}
          </span>
        }
      </button>

      <a
        routerLink="/admin"
        class="group rounded-full p-2.5 text-nude-400 transition-all duration-300 hover:rotate-90 hover:bg-nude-100 hover:text-sage-600 dark:text-nude-300 dark:hover:bg-nude-700 dark:hover:text-sage-300"
        aria-label="لوحة التحكم"
        title="لوحة التحكم"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </a>
    </div>
  </div>
</header>
