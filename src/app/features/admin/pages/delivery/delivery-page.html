<div class="mx-auto max-w-3xl">
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold text-nude-700 dark:text-nude-50">رسوم التوصيل</h1>
    <p class="mt-1 text-sm text-nude-700/60 dark:text-nude-400">حددي رسوم التوصيل لكل محافظة</p>
  </div>

  <div class="rounded-3xl border border-nude-200 bg-white p-6 shadow-[var(--shadow-card)] dark:border-nude-700 dark:bg-nude-800">
    @if (loading()) {
      <div class="space-y-2">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="skeleton h-12 w-full rounded-xl"></div>
        }
      </div>
    } @else if (error()) {
      <div class="rounded-xl border border-ruby-200 bg-ruby-50 p-6 text-center text-sm text-ruby-600 dark:border-ruby-800 dark:bg-ruby-900/20 dark:text-ruby-300">
        <p>{{ error() }}</p>
        <button
          type="button"
          class="mt-3 rounded-full bg-ruby-500 px-5 py-1.5 text-xs font-bold text-white transition hover:bg-ruby-600"
          (click)="load()"
        >
          إعادة المحاولة
        </button>
      </div>
    } @else {
      <ul class="divide-y divide-nude-100 dark:divide-nude-700">
        @for (fee of fees(); track fee.id) {
          <li class="flex items-center justify-between gap-3 py-2.5">
            <span class="text-sm font-semibold text-nude-700 dark:text-nude-100">{{ fee.governorate }}</span>

            <div class="flex items-center gap-2">
              <div class="relative">
                <input
                  type="number"
                  min="0"
                  step="0.5"
                  [ngModel]="editedFees()[fee.id] ?? fee.fee"
                  (ngModelChange)="onFeeInput(fee.id, $event)"
                  class="w-24 rounded-lg border border-nude-200 bg-nude-50/50 px-3 py-1.5 text-end text-sm outline-none transition focus:border-sage-400 focus:ring-2 focus:ring-sage-100 dark:border-nude-600 dark:bg-nude-900/50 dark:text-nude-50"
                />
                <span class="pointer-events-none absolute inset-y-0 start-2 flex items-center text-xs text-nude-400">ج.م</span>
              </div>

              <button
                type="button"
                [disabled]="!isEdited(fee) || savingId() === fee.id"
                (click)="save(fee)"
                class="flex h-8 w-16 shrink-0 items-center justify-center rounded-lg bg-sage-500 text-xs font-bold text-white transition hover:bg-sage-600 disabled:pointer-events-none disabled:opacity-40"
              >
                @if (savingId() === fee.id) {
                  <app-spinner size="sm" />
                } @else {
                  حفظ
                }
              </button>
            </div>
          </li>
        }
      </ul>
    }
  </div>
</div>
