<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="animate-toast-in pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-2xl border px-4 py-3 shadow-xl backdrop-blur-md"
      [class.bg-sage-50/95]="toast.type === 'success'"
      [class.border-sage-200]="toast.type === 'success'"
      [class.text-sage-700]="toast.type === 'success'"
      [class.bg-blush-50/95]="toast.type === 'error'"
      [class.border-blush-200]="toast.type === 'error'"
      [class.text-blush-700]="toast.type === 'error'"
      [class.bg-nude-50/95]="toast.type === 'info'"
      [class.border-nude-200]="toast.type === 'info'"
      [class.text-nude-700]="toast.type === 'info'"
    >
      <span class="text-sm font-medium leading-relaxed">{{ toast.message }}</span>
      <button
        type="button"
        class="ms-auto shrink-0 rounded-full p-1 text-current/60 transition hover:bg-black/5 hover:text-current"
        (click)="toastService.dismiss(toast.id)"
        aria-label="إغلاق"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  }
</div>
