<span
  class="inline-block animate-spin rounded-full border-solid border-current border-e-transparent align-[-0.125em] motion-reduce:animate-[spin_1.5s_linear_infinite]"
  [class.h-4]="size() === 'sm'"
  [class.w-4]="size() === 'sm'"
  [class.h-6]="size() === 'md'"
  [class.w-6]="size() === 'md'"
  [class.h-10]="size() === 'lg'"
  [class.w-10]="size() === 'lg'"
  [class.border-2]="size() !== 'lg'"
  [class.border-[3px]]="size() === 'lg'"
  role="status"
  aria-label="جارِ التحميل"
></span>
