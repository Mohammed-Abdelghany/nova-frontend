<button
  type="button"
  (click)="toggle()"
  class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-nude-500 transition-all duration-300 hover:bg-nude-100 hover:text-sage-600 dark:text-nude-300 dark:hover:bg-nude-700 dark:hover:text-sage-300"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن'"
  [title]="themeService.theme() === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن'"
>
  @if (themeService.theme() === 'dark') {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="4.5" />
      <path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.2A8.5 8.5 0 119.8 3.5a7 7 0 0010.7 10.7z" />
    </svg>
  }
</button>
